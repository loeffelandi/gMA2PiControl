# ASL: Encoder-Click schaltet Fine für genau diesen Encoder
# (Normal -> Fine -> Ultra -> Normal).
asl_click_1 = { encoder_fine = 1 }
asl_click_2 = { encoder_fine = 2 }
asl_click_3 = { encoder_fine = 3 }
asl_click_4 = { encoder_fine = 4 }
# ASL-Taste 1 schaltet zwischen Attribut- und Screen-Encodern um. Im
# Attribut-Modus folgen die Encoder dem Fenster, das die onPC anzeigt.
# Für den Screen-Modus müssen die Encoder-Namen eingetragen sein; solange
# [mapping.screen_encoders] fehlt, bleibt die Taste wirkungslos (Warnung im Log).
asl_bank = { screen_mode = true }

# Namen der Screen-Encoder, die im Screen-Modus auf Slot 1-4 gelegt werden.
# Beispiel (Namen müssen von der onPC als encoder.name akzeptiert werden):
# [mapping.screen_encoders]
# 1 = "screen1"
# 2 = "screen2"
# 3 = "screen3"
# 4 = "screen4"

[[mapping.encoders]]
id = 1
slot = 1

[[mapping.encoders]]
id = 2
slot = 2

[[mapping.encoders]]
id = 3
slot = 3

[[mapping.encoders]]
id = 4
slot = 4

[mapping.encoder_acceleration]
curve = "linear"          # none | linear | exponential
window = 0.10
max_multiplier = 4.0

# Nur für Encoder mit festem Attributnamen (siehe mapping.encoders.attribute).
[mapping.encoder_resolution.attribute]
normal = 1.0
fine = 0.1
ultra = 0.01

# ASL: Encoder-Klick = echter Encoder-Druck der onPC (wie ShowCockpit); mit
# MA gehalten trifft er den Screen-Encoder des Slots.
asl_click_1 = { encoder_press = 1 }
asl_click_2 = { encoder_press = 2 }
asl_click_3 = { encoder_press = 3 }
asl_click_4 = { encoder_press = 4 }
# ASL-Taste 1 schaltet zwischen Attribut- und Screen-Encodern um. Im
# Attribut-Modus folgen die Encoder dem Fenster, das die onPC anzeigt.
# Zusätzlich schaltet MA halten (Cherry-Logo) die Encoder vorübergehend auf
# die Screen-Encoder.
asl_bank = { screen_mode = true }
# Rechte ASL-Taste sendet den NIPPLE-Hardkey der onPC.
asl_button_3 = { hardkey = "NIPPLE" }

# Screen-Encoder-Nummern (5-10), die im Screen-Modus auf Slot 1-4 gelegt
# werden: Slot 1 -> 8, Slot 2 -> 7, Slot 3 -> 6, Slot 4 -> 5.
# Im Web-UI als Spalte "Screen-Encoder" pro physischem Encoder bearbeitbar;
# "— keiner —" entfernt den Slot.
[mapping.screen_encoders]
1 = 8
2 = 7
3 = 6
4 = 5

[[mapping.encoders]]
id = 1
slot = 1

[[mapping.encoders]]
id = 2
slot = 2

[[mapping.encoders]]
id = 3
slot = 3

[[mapping.encoders]]
id = 4
slot = 4

[mapping.encoder_acceleration]
curve = "linear"          # none | linear | exponential
window = 0.10
max_multiplier = 4.0

# ASL-Taste 2 halten + Encoder-Klick = Auflösung des Slots
# Normal -> Fine -> Ultra -> Normal (in der onPC umgeschaltet, nicht fuer Screen-Encoder).
[mapping.encoder_resolution.modifiers]
cycle = "asl_button_2"

# Faktoren für feste Attribut-Encoder und für Slot-Encoder mit Fine gehalten.
[mapping.encoder_resolution.attribute]
normal = 1.0
fine = 0.1
ultra = 0.01

[reconnect]
initial_delay = 1.0
max_delay = 30.0
jitter = 0.2
login_failure_delay = 10.0

[rate_limit]
messages_per_second = 25
burst = 10
encoder_base_interval = 0.025
encoder_stream_penalty = 0.0024
encoder_idle_base = 0.040
encoder_idle_penalty = 0.0022
max_pending_delta = 1000

[logging]
level = "INFO"

[led]
enabled = true                # Modus-LED an der ASL-Taste
note = 9                      # Taste 1 (Noten 9-11 = Tasten 1-3)
attribute_color = "red"       # Attribut-Modus
screen_color = "green"        # Screen-Modus
nipple_note = 11              # rechte ASL-Taste (NIPPLE)
nipple_idle_color = 121       # leicht orange
nipple_idle_brightness = 25
nipple_pressed_color = 116    # heller beim Drücken
nipple_pressed_brightness = 127
fine_note = 10                # mittlere ASL-Taste (Fine-Modifier)
fine_color = 123
fine_idle_brightness = 25
fine_pressed_brightness = 127

[web]
bind = "0.0.0.0"            # LAN-Zugriff; Änderung erst nach Dienstneustart
port = 8080
pin_enabled = false          # PIN-Sperre; bei false ist die API im LAN offen
pin = ""                     # 4-12 Ziffern, z. B. "123456"; leer = keine PIN

[devices.cherry]
vendor_id = 0x046a
product_id = 0x0000        # 0 = beliebiges Produkt dieser Vendor-ID
name_contains = "Cherry"
profile = "cherry-g86"

[devices.asl]
backend = "midi"           # ASL MK2-E4B3 meldet sich als USB-MIDI, nicht als evdev
vendor_id = 0x04d8
product_id = 0xe817
name_contains = "ASL MK2"
profile = "asl-mk2-e4b3"


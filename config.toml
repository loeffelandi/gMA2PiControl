schema_version = 1

[ma2]
host = "192.168.0.10"
port = 80
path = "/?ma=1"
username = "ma2pi"
password_file = "/etc/ma2pi/ma2pi.password"  # alternativ password_env
keepalive_interval = 5.0
login_timeout = 10.0
hardkey_transport = "lua"                     # lua = Command-Line sichtbar, native = keyname
hardkey_hold_threshold = 0.5                  # Sekunden halten, bevor eine Taste als "gehalten" gilt
hardkey_press_value = 1.0                     # value 1 = Taste gedrückt
hardkey_release_value = 0.0                   # value 0 = Taste losgelassen
page_refresh_interval = 1.0                   # veraltet, ohne Wirkung (kein presetTypes-Polling mehr)

# Screen-Tasten laufen über einen Keystroke-Helper auf dem onPC-PC (nicht über
# Web Remote): Insert an -> Ctrl+Alt+F1..F6 -> Insert aus. Der Helper lauscht
# auf UDP und sendet die Shortcuts. Siehe docs/screen-helper.ahk.
[screen_helper]
enabled = true
host = "192.168.0.10"                         # IP des onPC-PCs
port = 5005

